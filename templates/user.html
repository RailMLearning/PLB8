<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <title>Пользователь {{ user.name }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <style>
      .chart-container { position: relative; height: 300px; width: 100%; }
    </style>
  </head>
  <body class="container mt-4">
    <h1>Пользователь: {{ user.name }}</h1>
    <p><strong>ID:</strong> {{ user.id }}</p>

    <h2 class="mt-4">Подписки на валюты</h2>
    {% if currencies %}
      <ul class="list-group">
        {% for currency in currencies %}
          <li class="list-group-item">
            <div class="d-flex justify-content-between align-items-center">
              <div>
                <strong>{{ currency.char_code }}</strong> — {{ currency.name }}
              </div>
              <span class="badge text-bg-secondary">Текущий курс: {{ currency.value }}</span>
            </div>
            <div class="chart-container mt-2">
              <canvas id="chart_{{ currency.char_code }}"></canvas>
            </div>
          </li>
        {% endfor %}
      </ul>
    {% else %}
      <p class="text-muted">Нет подписок на валюты.</p>
    {% endif %}

    <a href="/users" class="btn btn-secondary mt-3">Назад</a>

    <script>
      {% for currency in currencies %}
        const ctx{{ currency.char_code }} = document.getElementById("chart_{{ currency.char_code }}");
        const chart{{ currency.char_code }} = new Chart(ctx{{ currency.char_code }}, {
          type: 'line',
          data: {
            labels: [],
            datasets: [{
              label: '{{ currency.char_code }}',
              data: [],
              borderColor: '#0d6efd',
              backgroundColor: 'rgba(13,110,253,0.1)',
              tension: 0.3,
              pointRadius: 3,
              pointHoverRadius: 5
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: { y: { beginAtZero: false } }
          }
        });

        // Асинхронно подтягиваем историю, добавляем точки по мере прихода
        fetch(`/history?code={{ currency.char_code }}`)
          .then(resp => resp.json())
          .then(points => {
            points.forEach(p => {
              chart{{ currency.char_code }}.data.labels.push(p.date);
              chart{{ currency.char_code }}.data.datasets[0].data.push(p.value);
              chart{{ currency.char_code }}.update();
            });
          })
          .catch(() => { /* молча игнорируем */ });
      {% endfor %}
    </script>
  </body>
</html>
